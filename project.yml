# Source of truth for MetriBar.xcodeproj. Regenerate with `xcodegen generate`
# after changing targets or build settings. Source files are synchronized
# folders, so adding or removing files does not require regeneration.
#
# Team, bundle identifier and entitlements come from Config/Shared.xcconfig
# and can be overridden in Config/Local.xcconfig (see the .example file).
name: MetriBar
options:
  bundleIdPrefix: it.schnabel
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.12.0
    CURRENT_PROJECT_VERSION: 3
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  MetriBarKit:
    path: Packages/MetriBarKit
schemes:
  MetriBar:
    build:
      targets:
        MetriBar: all
    run:
      config: Debug
    archive:
      config: Release
  MetriBar-iOS:
    build:
      targets:
        MetriBar-iOS: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  MetriBar:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: MetriBar
        type: syncedFolder
      # Asset catalog and string catalogs, as a regular group so that the
      # target gets a Copy Bundle Resources phase.
      - path: Resources
      # The views of the widgets, which the snapshot tool renders in DEBUG
      # builds. A regular group, because Xcode does not allow one synchronized
      # folder in two targets; adding a file here needs `xcodegen generate`.
      - path: Shared/Widgets
      - path: Shared/Platform
    dependencies:
      - package: MetriBarKit
      - target: MetriBarWidgets
        embed: true
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: MetriBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 Thomas Schnabel. Licensed under the Apache License 2.0.
        NSLocalNetworkUsageDescription: MetriBar connects to the Glances servers you configure on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Widgets open the dashboard with metribar://dashboard and
        # metribar://server/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: $(METRIBAR_BUNDLE_ID)
            CFBundleURLSchemes: [metribar]
        MetriBarAppGroup: $(METRIBAR_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(METRIBAR_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: $(METRIBAR_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
  MetriBarWidgets:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: MetriBarWidgets
        type: syncedFolder
      - path: Shared/Widgets
      # The same translations as the app: one catalog, one source of truth.
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: MetriBarKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Config/WidgetsInfo.plist
      properties:
        CFBundleDisplayName: MetriBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: Copyright © 2026 Thomas Schnabel. Licensed under the Apache License 2.0.
        MetriBarAppGroup: $(METRIBAR_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(METRIBAR_BUNDLE_ID).Widgets
        CODE_SIGN_ENTITLEMENTS: $(METRIBAR_WIDGET_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
  MetriBar-iOS:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: MetriBariOS
        type: syncedFolder
      - path: Resources
      - path: Shared/Platform
      - path: MetriBar
        type: syncedFolder
        excludes:
          - MetriBarApp.swift
          - MenuBar/MenuBarImage.swift
          - MenuBar/MenuBarLabel.swift
          - MenuBar/MenuBarMetric+Text.swift
          - MenuBar/OnboardingView.swift
          - MenuBar/PopoverView.swift
          - MenuBar/ServerSummary.swift
          - MenuBar/UpdateBanner.swift
          - Debug/SnapshotRenderer.swift
    dependencies:
      - package: MetriBarKit
      - target: MetriBarWidgets-iOS
        embed: true
    info:
      path: Config/iOSInfo.plist
      properties:
        CFBundleDisplayName: MetriBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: MetriBar connects to the Glances servers you configure on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: $(METRIBAR_BUNDLE_ID)
            CFBundleURLSchemes: [metribar]
        MetriBarAppGroup: $(METRIBAR_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(METRIBAR_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Config/MetriBar-iOS.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  MetriBarWidgets-iOS:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: MetriBarWidgets/AppGroup.swift
      - path: MetriBarWidgets/MetriBarWidgets.swift
      - path: MetriBarWidgets/Provider.swift
      - path: MetriBarWidgets/ServerEntity.swift
      - path: Shared/Widgets/WidgetViews.swift
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: MetriBarKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: Config/WidgetsInfo-iOS.plist
      properties:
        CFBundleDisplayName: MetriBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MetriBarAppGroup: $(METRIBAR_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(METRIBAR_BUNDLE_ID).Widgets
        CODE_SIGN_ENTITLEMENTS: Config/MetriBarWidgets-iOS.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
