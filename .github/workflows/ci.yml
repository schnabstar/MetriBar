name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select --switch "$xcode"
          xcodebuild -version

      - name: Check formatting
        run: xcrun swift-format lint --strict --recursive MetriBar Packages

      - name: Test MetriBarKit
        run: swift test --package-path Packages/MetriBarKit

      - name: Build app
        run: >
          xcodebuild build
          -project MetriBar.xcodeproj
          -scheme MetriBar
          -destination 'platform=macOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
